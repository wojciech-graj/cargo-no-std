[package]
name = "cargo-no-std"
version = "0.2.1"
edition = "2024"
rust-version = "1.91.0"

description = "Validate no_std compliance"
readme = "README.md"
repository = "https://github.com/wojciech-graj/cargo-no-std"
license = "GPL-3.0-only"
keywords = ["no-std"]
categories = ["command-line-utilities", "development-tools", "development-tools::cargo-plugins"]

[dependencies]
anyhow = "1.0.1"
cargo_metadata = "0.23"
cargo_toml = "1"
clap = { version = "4", features = ["cargo", "derive"] }
clap-cargo = { version = "0.19", features = ["cargo_metadata"] }
colored = "3"
env_logger = "0.11"
indicatif = "0.18"
indicatif-log-bridge = "0.2"
log = "0.4"
quote = "1"
rayon = "1"
serde_json = "1"
tempfile = "3.20"
toml = "1"
toml_edit = "0.25"

[dev-dependencies]
assert_cmd = "2.1"

[profile.dist]
inherits = "release"
lto = "thin"
